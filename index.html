<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="https://joaopedromuller.me/" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Joao Pereira — cybersecurity and networking student, tutor, recreational runner, and professional esports player."
    />
    <title>João Pereira</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <span class="identity" aria-label="Joao Pereira"
        ><span class="full-name">Joao Pereira.</span></span
      ><button
        id="theme"
        aria-label="Switch to dark mode"
        title="Switch to dark mode"
      ></button>
    </header>
    <main class="canvas" aria-label="Portfolio network">
      <button class="node contact" data-node="contact">
        <svg viewBox="0 0 80 58" aria-hidden="true">
          <path
            d="M21 44h39a12 12 0 0 0 0-24h-3a19 19 0 0 0-36-3 14 14 0 0 0 0 27Z"
          /></svg
        ><span>Connect</span>
      </button>
      <svg
        class="wires"
        viewBox="0 0 1000 700"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          d="M500 180V350M200 200V350H800V200M200 520V350M800 520V350M500 350V560"
        />
      </svg>
      <button class="node profile" data-node="about">
        <svg viewBox="0 0 80 58" aria-hidden="true">
          <path class="device-fill" d="M6 16v27c0 16 68 16 68 0V16" />
          <ellipse class="device-top" cx="40" cy="16" rx="34" ry="12" />
          <path
            class="device-mark"
            d="M22 16h36M27 11l-6 5 6 5M53 11l6 5-6 5M40 6v20"
          /></svg
        ><span>About me</span>
      </button>
      <button class="node experience" data-node="experience">
        <svg viewBox="0 0 80 60" aria-hidden="true">
          <rect
            class="device-fill"
            x="12"
            y="4"
            width="56"
            height="38"
            rx="2"
          />
          <path class="device-mark" d="M18 10h44v25H18z" />
          <path d="M40 43v9M25 54h30" /></svg
        ><span>Experience</span>
      </button>
      <button class="node project" data-node="project">
        <svg viewBox="0 0 80 60" aria-hidden="true">
          <rect
            class="device-fill"
            x="15"
            y="4"
            width="50"
            height="37"
            rx="2"
          />
          <path d="M15 42 6 54h68L65 42" />
          <path class="device-mark" d="m34 15-8 7 8 7m12-14 8 7-8 7" /></svg
        ><span>TutorTrack</span>
      </button>
      <button class="switch" data-node="skills" aria-label="Skills">
        <svg viewBox="0 0 90 42">
          <path class="device-fill" d="m5 12 10-7h62l8 7v24H5Z" />
          <path d="M5 12h80" />
          <path
            class="device-mark"
            d="M13 20h8v8h-8zM27 20h8v8h-8zM41 20h8v8h-8zM55 20h8v8h-8zM69 20h8v8h-8z"
          /></svg
        ><span class="switch-caption">Skills</span>
      </button>
      <button class="node running" data-node="running">
        <svg viewBox="0 0 80 60" aria-hidden="true">
          <circle cx="49" cy="9" r="5" />
          <path
            d="m26 22 12-7 13 14 13 1M38 16 29 34l16 7-4 14M30 33 20 48H8M7 18h13M4 27h11"
          /></svg
        ><span>Off the clock</span>
      </button>
      <button class="node esports" data-node="esports">
        <svg viewBox="0 0 80 60" aria-hidden="true">
          <path
            class="device-fill"
            d="M25 16h30c9 0 12 11 16 26S65 57 55 43H25C15 57 5 57 9 42S16 16 25 16Z"
          />
          <path
            class="device-mark"
            d="M23 25v13M17 31h12M53 27h1M61 34h1"
          /></svg
        ><span>Esports</span>
      </button>
      <button class="node tutoring" data-node="tutoring">
        <svg viewBox="0 0 80 60" aria-hidden="true">
          <path
            class="device-fill"
            d="M8 9c13-4 23-2 32 5 9-7 19-9 32-5v39c-13-4-23-2-32 5-9-7-19-9-32-5Z"
          />
          <path
            class="device-mark"
            d="M40 14v39M16 20l15 3M16 29l15 3M49 23l15-3M49 32l15-3"
          /></svg
        ><span>Tutoring</span>
      </button>
    </main>

    <dialog id="detail">
      <button id="close" aria-label="Close details" title="Close">×</button>
      <div id="detail-content"></div>
    </dialog>
  </body>
</html>
